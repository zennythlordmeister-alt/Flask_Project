<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Toko Cihuy Anjay</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .shade {
            box-shadow: 10px 10px 0px 2px black;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-mono min-h-screen flex items-center justify-center p-4">

    <!-- Card Register Wrapper -->
    <div class="bg-white border-2 border-black w-full max-w-md p-8 rounded-sm shade">
        
        <!-- Header / Logo -->
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold tracking-wide">Buat Akun</h1>
            <p id="status" class="text-sm text-slate-500 mt-1">Silakan daftar untuk membuat akun kasir.</p>
        </div>

        <!-- Form Register -->
        <form id="register_form" method="POST" class="space-y-5">
            
            <!-- Input Username -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider mb-2" for="username">
                    Username
                </label>
                <input 
                    class="w-full px-4 py-2.5 bg-slate-50 border-2 border-black rounded-sm focus:outline-none focus:ring-2 focus:ring-red-600 text-sm" 
                    type="text" 
                    id="username" 
                    name="username" 
                    placeholder="Masukkan username..." 
                    required 
                    autocomplete="username"
                />
            </div>

            <!-- Input Password -->
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider mb-2" for="password">
                    Password
                </label>
                <input 
                    class="w-full px-4 py-2.5 bg-slate-50 border-2 border-black rounded-sm focus:outline-none focus:ring-2 focus:ring-red-600 text-sm" 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="••••••••" 
                    required 
                    autocomplete="new-password"
                />
            </div>

            <!-- Tombol Submit -->
            <button 
                type="submit" 
                class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-sm border-2 border-black transition-colors shadow-[4px_4px_0px_0px_black] active:translate-x-0.5 active:translate-y-0.5 cursor-pointer"
            >
                Daftar
            </button>

        </form>

        <div class="mt-6 text-center text-xs text-slate-600">
            Sudah punya akun? <a href="/login" class="font-bold text-red-600 hover:underline">Masuk di sini</a>
        </div>

        <!-- Footer / Bantuan kecil -->
        <div class="mt-4 text-center text-xs text-slate-400">
            &copy; 2026 Toko Cihuy Anjay. All rights reserved.
        </div>

    </div>

    <script>
        const form = document.getElementById('register_form');
        const status = document.getElementById('status');

        form.addEventListener('submit', async function(event) {
            event.preventDefault();

            const usernameVal = document.getElementById('username').value;
            const passwordVal = document.getElementById('password').value;

            const data_response = {
                username: usernameVal,
                password: passwordVal
            };

            status.textContent = "Sedang memproses pendaftaran...";
            status.className = "text-sm text-blue-500 mt-1 font-semibold";

            const response = await fetch('/api/register', {
                method: "POST",
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data_response)
            });

            const hasil = await response.json();

            if (response.ok) {
                status.textContent = hasil.Pesan;
                status.className = "text-sm text-green-600 mt-1 font-semibold";
                form.reset();
                window.location.href = '/login';
            } else {
                status.textContent = hasil.Pesan;
                status.className = "text-sm text-red-600 mt-1 font-semibold";
            }
        });
    </script>
</body>
</html>
