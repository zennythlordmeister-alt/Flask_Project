<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasir Alfamart - Halaman Utama</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .neo-shade{
            box-shadow: 10px 10px 0px 2px black;
        }
        .neo-shade:hover{
            box-shadow: 16px 16px 0px 2px black;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex font-mono">

    <!-- Memanggil Sidebar via Jinja2 Include -->
    {% include 'sidebar.html' %}

    <!-- Wrapper untuk Konten Utama di sebelah kanan sidebar -->
    <div class="flex-1 flex flex-col min-w-0">
        
        <!-- Top Navbar -->

        <!-- Main Content (Grid Produk dari API) -->
        <main class="flex-1 p-6 md:p-10">
            <div class="mb-10">
                <a href="/tambah" class="border border-black w-fit px-3 py-1 rounded-full hover:bg-green-500 transition-all group">
                    <span class="text-xs text-gray-700 md:text-sm font-medium group-hover:text-white transition-all">
                        <span class="text-green-600 font-bold group-hover:text-white">+</span> Tambah Barang
                    </span>
                </a>
            </div>
            <section id="category" data-name="makanan" class="font-mono max-w-5xl mx-auto">
                <!-- Section Title -->
                <h2 class="font-bold text-xl text-slate-800 mb-6">Daftar Barang di Gudang</h2>

                <!-- Simple Card Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8">
                    
                    <!-- Contoh Card Statis (Nanti akan ditimpa oleh script fetch) -->
                    <div class="bg-white border-2 border-black rounded-sm p-5 neo-neo-shade transition-all">
                        <div class="flex flex-col items-center gap-4 text-center">
                            <div>
                                <img src="https://img.magnific.com/free-vector/golden-number-1-one-champion-template-design-vector_1017-45556.jpg?semt=ais_hybrid&w=740&q=80" alt="Gambar Produk" class="max-w-[100px] mx-auto border border-black">
                            </div>
                            <div>
                                <span class="inline-block text-xs font-semibold text-red-600 bg-red-50 px-2.5 py-0.5 rounded-full mb-2 border border-red-200">
                                    Makanan
                                </span>
                                <h3 class="font-bold text-lg text-slate-800">Nama Barang</h3>
                                <p class="text-sm text-slate-500 mt-1">Deskripsi singkat atau stok barang.</p>
                                <div class="mt-4 pt-3 border-t border-slate-200 flex items-center justify-center">
                                    <span class="font-bold text-slate-900">Rp 15.000</span>
                                </div>
                            </div>
                        </div>
                        <button class="text-xs font-semibold bg-red-600 hover:bg-red-700 text-white px-3 py-2 rounded-lg transition-colors w-full mt-4 border border-black">
                            Beli
                        </button>
                    </div>

                </div>
            </section>
        </main>
    </div>

</body>
<script>
    // 1. Ambil data dari backend Flask
    fetch('/api/barang') 
      .then(response => response.json())
      .then(data => {
        console.log("Data dari database:", data);

        const gridContainer = document.querySelector('#category .grid');
        gridContainer.innerHTML = '';

        data.forEach(item => {
            let warna = 'purple'; 
            if (item.kategori === 'Makanan') {
                warna = 'red';
            } else if (item.kategori === 'Transportasi') {
                warna = 'blue';
            }

            const cardHTML = `
            <div class="bg-white border-2 border-black rounded-sm p-5 neo-shade transition-all">
                <div class="flex flex-col items-center gap-4 text-center">
                    <div>
                        <img src="${item.gambar || 'https://via.placeholder.com/100'}" alt="Gambar Produk" class="max-w-[100px] mx-auto border border-black">
                    </div>
                    <div>
                        <span class="inline-block text-xs font-semibold text-${warna}-600 bg-${warna}-50 px-2.5 py-0.5 rounded-full mb-2 border border-${warna}-200">
                            ${item.kategori || 'Makanan'}
                        </span>
                        <h3 class="font-bold text-lg text-slate-800">${item.nama_barang}</h3>
                        <p class="text-sm text-slate-500 mt-1">${item.deskripsi_barang}</p>
                        <div class="mt-4 pt-3 border-t border-slate-200 flex items-center justify-center">
                            <span class="font-bold text-slate-900">Stok : ${item.stok}</span>
                        </div>
                    </div>
                </div>
                <button class="text-xs font-semibold bg-${warna}-600 hover:bg-${warna}-700 text-white px-3 py-2 rounded-lg transition-colors w-full mt-4 border border-black">
                    <span class="font-bold">Rp ${item.harga_barang}</span>
                </button>
            </div>
            `;

            gridContainer.innerHTML += cardHTML;
        });
      })
      .catch(error => console.error('Gagal memuat data:', error));
</script>
</html>
